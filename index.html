<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f8fafc" />
  <title>팀플보드 — 함께 만드는 투명한 팀플</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Radio+Canada+Big:wght@400;500;600;700&family=Red+Hat+Text:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#2563eb;--blue-dark:#1d4ed8;--blue-soft:#eff6ff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc;--white:#fff;--green:#16a34a;--green-ink:#065f46;--amber:#d97706;--amber-ink:#78350f;--red:#dc2626;--red-ink:#991b1b;--radius:16px;--shadow:0 18px 48px -20px rgba(15,23,42,.25)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Radio Canada Big',sans-serif;font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0}h1,h2,h3,.brand-name{font-family:'Red Hat Text',sans-serif} .mono{font-family:'Fira Code',monospace;font-variant-numeric:tabular-nums} .hidden{display:none!important}
    .topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1160px)/2));position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}.logo{width:38px;height:38px;border-radius:12px;background:var(--blue);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:700}.brand-name{font-weight:800;font-size:18px;letter-spacing:-.5px}.brand-sub{font-size:11px;color:var(--muted);margin-top:1px}.top-actions{display:flex;align-items:center;gap:10px}.container{width:min(1120px,calc(100% - 40px));margin:0 auto}.page{padding:42px 0 64px}
    .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s}.btn:hover{border-color:#94a3b8;background:#f8fafc}.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-dark);border-color:var(--blue-dark)}.btn-quiet{border-color:transparent;background:transparent;color:var(--muted)}.btn-danger{color:var(--red);border-color:#fecaca}.btn-sm{padding:7px 10px;font-size:12px}.icon-btn{width:36px;height:36px;padding:0;font-size:17px}
    .landing{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:48px 20px}.landing-layout{width:min(1050px,100%);display:grid;grid-template-columns:1.03fr .97fr;gap:74px;align-items:center}.eyebrow{color:var(--blue-dark);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}.eyebrow:before{content:'';width:22px;height:2px;background:var(--blue)}.hero h1{font-size:48px;line-height:1.12;letter-spacing:-1.6px;margin:18px 0 16px}.hero h1 span{color:var(--blue)}.hero p{font-size:16px;line-height:1.7;color:var(--muted);max-width:460px}.value-points{display:flex;gap:22px;margin-top:30px;color:#475569;font-size:12px}.value-points span{display:flex;align-items:center;gap:7px}.check{width:19px;height:19px;border-radius:50%;background:#dcfce7;color:var(--green-ink);display:grid;place-items:center;font-size:11px;font-weight:700}.form-card,.panel,.task-card,.meeting-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius)}.form-card{padding:28px;box-shadow:0 10px 28px -24px rgba(15,23,42,.25)}.form-card h2{font-size:21px;margin-bottom:5px}.form-card .sub{color:var(--muted);margin-bottom:22px}.field{margin-bottom:16px}.field label{display:block;font-weight:600;margin-bottom:7px;font-size:13px}.field .hint{color:var(--muted);font-size:11px;margin-top:6px}.input,.textarea,.select{width:100%;border:1px solid #cbd5e1;background:white;border-radius:10px;padding:11px 12px;outline:none;color:var(--ink)}.input:focus,.textarea:focus,.select:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #dbeafe}.input::placeholder,.textarea::placeholder{color:#94a3b8}.textarea{min-height:92px;resize:vertical}.member-entry{display:flex;gap:8px}.member-entry .input{flex:1}.member-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;min-height:4px}.member-tag{padding:6px 9px;background:var(--blue-soft);color:#1e40af;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:7px}.member-tag button{border:0;background:none;color:#1e40af;padding:0;line-height:1}.form-error{font-size:12px;color:var(--red);margin:10px 0;min-height:16px}.form-card>.btn{width:100%;padding:13px}.sample-board{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 16px 48px -34px #334155;transform:rotate(1.2deg)}.sample-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.sample-title{font-family:'Red Hat Text';font-weight:700}.sample-chip{background:#dcfce7;color:var(--green-ink);font-size:10px;padding:5px 8px;border-radius:99px}.sample-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.sample-stat{background:#f8fafc;border:1px solid #eef2f7;padding:12px;border-radius:12px}.sample-stat b{font-family:'Fira Code';font-size:20px}.sample-stat small{display:block;color:var(--muted);margin-top:4px}.sample-task{display:flex;align-items:center;gap:10px;padding:11px 8px;border-top:1px solid #f1f5f9}.sample-avatar,.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#dbeafe;color:#1d4ed8;font-weight:700;font-size:11px;flex-shrink:0}.sample-task .task-meta{flex:1}.sample-task small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.status{display:inline-flex;padding:5px 9px;border-radius:99px;font-weight:600;font-size:11px;white-space:nowrap;background:#f1f5f9;color:#475569}.status.progress{background:#dbeafe;color:#1d4ed8}.status.done{background:#dcfce7;color:var(--green-ink)}.status.late{background:#fee2e2;color:var(--red-ink)}.status.warning{background:#fef3c7;color:var(--amber-ink)}
    .dashboard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:24px}.dashboard-head h1{font-size:30px;letter-spacing:-.6px;margin:7px 0}.course{display:inline-flex;background:var(--blue-soft);color:#1d4ed8;padding:5px 9px;border-radius:6px;font-size:11px;font-weight:600}.header-actions{display:flex;gap:8px}.stats-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;margin-bottom:24px}.panel{padding:22px}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}.panel-title h2{font-size:17px}.panel-title p{color:var(--muted);font-size:12px;margin-top:3px}.completion-number{font-family:'Fira Code';font-weight:600;font-size:23px}.progress-track,.bar-track{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden}.progress-fill,.bar-fill{height:100%;background:var(--blue);border-radius:99px;transition:width .3s}.overall-caption{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:8px 0 18px}.member-progress{display:grid;gap:13px}.member-row{display:grid;grid-template-columns:110px 1fr 52px;align-items:center;gap:10px}.member-label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;min-width:0}.mini-avatar{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:10px;background:#eff6ff;color:#1e40af;flex-shrink:0}.member-row .bar-track{height:7px}.member-count{text-align:right;font:11px 'Fira Code';color:var(--muted)}.legend{font-size:11px;color:var(--muted)}
    .section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:36px 0 15px}.section-head h2{font-size:21px}.section-head p{font-size:12px;color:var(--muted);margin-top:4px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.filter{border:1px solid var(--line);background:white;color:#475569;padding:7px 12px;border-radius:99px;font-size:12px;font-weight:600}.filter.active{border-color:var(--blue);background:var(--blue);color:#fff}.task-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.task-card{padding:17px 18px;transition:.18s}.task-card.overdue{border-color:#fca5a5}.task-top{display:flex;align-items:flex-start;gap:12px}.task-main{min-width:0;flex:1}.task-main h3{font-size:15px;line-height:1.4;margin-bottom:9px;overflow-wrap:anywhere}.task-owner{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.task-tools{display:flex;gap:5px}.task-bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f1f5f9;padding-top:12px;margin-top:14px;gap:10px}.task-due{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}.task-links{display:flex;gap:6px;align-items:center}.empty{border:1px dashed #cbd5e1;border-radius:14px;padding:38px 20px;text-align:center;color:var(--muted);grid-column:1/-1}.empty-icon{font-size:25px;margin-bottom:9px}.empty strong{display:block;color:#334155;margin-bottom:5px}.meeting-layout{display:grid;grid-template-columns:.86fr 1.14fr;gap:16px}.meeting-form{padding:20px}.meeting-list{display:grid;gap:11px;align-content:start}.meeting-card{padding:18px}.meeting-meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:13px}.meeting-meta time{font:12px 'Fira Code';color:var(--muted)}.attendees{display:flex;gap:5px;flex-wrap:wrap}.attendee{background:#f1f5f9;border-radius:99px;padding:4px 8px;font-size:10px;color:#475569}.decision{background:var(--blue-soft);border-radius:10px;padding:13px 14px;color:#1e3a8a;line-height:1.6;white-space:pre-wrap}.meeting-subtitle{font-size:11px;font-weight:700;color:#475569;margin:12px 0 6px}.action-line{padding:5px 0;color:#334155;font-size:12px;line-height:1.5}.meeting-original{border:0;background:none;color:var(--blue-dark);padding:7px 0 0;font-size:11px;font-weight:600}.original-text{font-size:12px;line-height:1.6;color:#64748b;white-space:pre-wrap;padding-top:9px}.footer{text-align:center;color:#94a3b8;font-size:11px;padding:38px 0 0}
    .modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.4);display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(520px,100%);max-height:min(90vh,780px);overflow:auto;background:#fff;border-radius:20px;padding:24px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}.modal-head h2{font-size:21px}.modal-head p{color:var(--muted);font-size:12px;margin-top:5px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.checkline{display:flex;align-items:center;gap:9px;font-size:13px;color:#334155;margin:8px 0}.checkline input{accent-color:var(--blue);width:16px;height:16px}.toast{position:fixed;top:86px;left:50%;transform:translate(-50%,-18px);opacity:0;background:#0f172a;color:#fff;border-radius:10px;padding:12px 17px;z-index:40;box-shadow:var(--shadow);transition:.25s;pointer-events:none;font-size:13px}.toast.show{transform:translate(-50%,0);opacity:1}.tabbar{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:24px 0 2px}.tab{padding:10px 13px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-weight:600;font-size:13px}.tab.active{color:var(--blue-dark);border-bottom-color:var(--blue)}.tab-content{display:none}.tab-content.active{display:block}
    @media(max-width:800px){.landing-layout{grid-template-columns:1fr;gap:32px;max-width:540px}.hero h1{font-size:39px}.sample-board{transform:none}.stats-grid,.meeting-layout{grid-template-columns:1fr}.topbar{padding:0 20px}.task-grid{grid-template-columns:1fr}.dashboard-head{align-items:flex-start}.page{padding-top:28px}}
    @media(max-width:520px){.container{width:calc(100% - 28px)}.topbar{height:64px;padding:0 14px}.top-actions .btn{padding:8px 10px;font-size:11px}.brand-name{font-size:16px}.brand-sub{display:none}.logo{width:34px;height:34px}.landing{padding:32px 16px}.hero h1{font-size:34px}.hero p{font-size:14px}.value-points{gap:12px;flex-wrap:wrap}.form-card{padding:21px}.dashboard-head{display:block}.header-actions{margin-top:14px}.header-actions .btn{flex:1}.dashboard-head h1{font-size:26px}.panel{padding:17px}.member-row{grid-template-columns:94px 1fr 48px;gap:7px}.section-head{align-items:flex-start}.section-head .btn{font-size:11px;padding:8px 10px}.task-card{padding:15px}.meeting-form{padding:16px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" id="homeLink"><div class="logo">팀</div><div><div class="brand-name">팀플보드</div><div class="brand-sub">함께 만드는 투명한 팀플</div></div></a>
    <div class="top-actions" id="globalActions"></div>
  </header>
  <main id="app"></main>
  <div id="modalRoot"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
  (()=>{
    const KEY='teamplay-boards-v1', colors=['#dbeafe','#dcfce7','#fef3c7','#fce7f3','#ede9fe','#cffafe'];
    const app=document.querySelector('#app'), actions=document.querySelector('#globalActions'), modalRoot=document.querySelector('#modalRoot'), toastEl=document.querySelector('#toast');
    const today=()=>new Date().toISOString().slice(0,10), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let boards=JSON.parse(localStorage.getItem(KEY)||'{}'), currentId=new URLSearchParams(location.search).get('board'), currentFilter='all', activeTab='tasks', toastTimer;
    const persist=()=>localStorage.setItem(KEY,JSON.stringify(boards)), board=()=>boards[currentId];
    const toast=msg=>{toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2500)};
    function statusOf(t){if(t.status==='done')return'done';if(t.due<today())return'late';return t.status==='progress'?'progress':'todo'}
    const statusName=s=>({done:'제출완료',late:'마감지연',progress:'진행중',todo:'진행전'})[s];
    function contribution(b){let all=b.tasks.filter(t=>statusOf(t)==='done').length;return b.members.map((name,i)=>{let tasks=b.tasks.filter(t=>t.owner===name),done=tasks.filter(t=>statusOf(t)==='done').length;return{name,i,tasks:tasks.length,done,pct:all?done/all*100:0}})}
    function newId(){return Math.random().toString(36).slice(2,9)}
    function setUrl(id){const u=new URL(location.href);if(id)u.searchParams.set('board',id);else u.searchParams.delete('board');history.pushState({},'',u);currentId=id}
    function landing(){actions.innerHTML='<span style="font-size:12px;color:#64748b">회원가입 없이 바로 시작</span>';app.innerHTML=`<section class="landing"><div class="landing-layout"><div class="hero"><div class="eyebrow">TEAMPLAY, MADE CLEAR</div><h1>팀플의 모든 순간을<br><span>한눈에 투명하게.</span></h1><p>역할 분담부터 제출 현황, 회의 결정까지.<br>우리 팀의 진행 상황을 한곳에서 함께 확인하세요.</p><div class="value-points"><span><i class="check">✓</i> 가입 없이 링크로 초대</span><span><i class="check">✓</i> 한눈에 보는 기여도</span></div><div class="sample-board"><div class="sample-head"><div class="sample-title">마케팅원론 · 3조 팀플</div><span class="sample-chip">팀 진행 중</span></div><div class="sample-stats"><div class="sample-stat"><b>68%</b><small>전체 진행률</small></div><div class="sample-stat"><b>4명</b><small>함께하는 팀원</small></div></div><div class="sample-task"><span class="sample-avatar">민</span><div class="task-meta"><b>경쟁사 사례 조사</b><small>김민지 · 오늘 마감</small></div><span class="status progress">진행중</span></div><div class="sample-task"><span class="sample-avatar" style="background:#dcfce7;color:#166534">준</span><div class="task-meta"><b>설문 결과 분석</b><small>이준호 · 어제 제출</small></div><span class="status done">제출완료</span></div></div></div><form class="form-card" id="createForm"><h2>새 팀플 보드 만들기</h2><p class="sub">프로젝트 정보를 입력하고 팀원을 초대해 보세요.</p><div class="field"><label for="projectName">프로젝트명 <span style="color:#dc2626">*</span></label><input class="input" id="projectName" maxlength="30" placeholder="예: 마케팅원론 3조 팀플" /></div><div class="field"><label for="courseName">과목명 <span style="color:#94a3b8;font-weight:400">선택</span></label><input class="input" id="courseName" maxlength="20" placeholder="예: 경영학원론" /></div><div class="field"><label for="memberInput">조원 이름 <span style="color:#dc2626">*</span></label><div class="member-entry"><input class="input" id="memberInput" maxlength="10" placeholder="이름 입력 후 추가" /><button class="btn" type="button" id="addMember">추가</button></div><div class="member-tags" id="memberTags"></div><p class="hint">조원은 2~6명까지 등록할 수 있어요.</p></div><div class="form-error" id="createError"></div><button class="btn btn-primary" type="submit">팀플 보드 시작하기 <span aria-hidden="true">→</span></button></form></div></section>`;
      const names=[];function renderTags(){document.querySelector('#memberTags').innerHTML=names.map((n,i)=>`<span class="member-tag">${esc(n)}<button type="button" data-remove="${i}" aria-label="${esc(n)} 삭제">×</button></span>`).join('')};function add(){let inp=document.querySelector('#memberInput'),n=inp.value.trim();if(!n)return;if(names.length>=6){document.querySelector('#createError').textContent='조원은 최대 6명까지 등록할 수 있어요.';return}if(names.includes(n)){document.querySelector('#createError').textContent='이미 등록된 이름이에요.';return}names.push(n);inp.value='';document.querySelector('#createError').textContent='';renderTags()}
      document.querySelector('#addMember').onclick=add;document.querySelector('#memberInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};document.querySelector('#memberTags').onclick=e=>{let i=e.target.dataset.remove;if(i!==undefined){names.splice(+i,1);renderTags()}};
      document.querySelector('#createForm').onsubmit=e=>{e.preventDefault();const name=document.querySelector('#projectName').value.trim(),err=document.querySelector('#createError');if(name.length<2){err.textContent='프로젝트명을 2자 이상 입력해 주세요.';return}if(names.length<2){err.textContent='최소 2명 이상의 조원을 등록해 주세요.';return}const id=newId();boards[id]={id,name,course:document.querySelector('#courseName').value.trim(),members:[...names],tasks:[],meetings:[],createdAt:today()};persist();setUrl(id);render()};
    }
    function render(){if(!currentId||!boards[currentId]){currentId=null;landing();return}const b=board();actions.innerHTML=`<button class="btn" id="copyInvite">↗ <span>초대 링크 복사</span></button>`;dashboard(b);document.querySelector('#copyInvite').onclick=async()=>{try{await navigator.clipboard.writeText(location.href)}catch{const t=document.createElement('textarea');t.value=location.href;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}toast('초대 링크가 클립보드에 복사되었습니다!')};}
    function dashboard(b){const stats=contribution(b),done=b.tasks.filter(t=>statusOf(t)==='done').length,overall=b.tasks.length?Math.round(done/b.tasks.length*100):0;let list=b.tasks.filter(t=>currentFilter==='all'||t.owner===currentFilter);list.sort((a,c)=>a.due.localeCompare(c.due));
      app.innerHTML=`<div class="container page"><div class="dashboard-head"><div><div class="eyebrow">TEAM WORKSPACE</div><h1>${esc(b.name)}</h1>${b.course?`<span class="course">${esc(b.course)}</span>`:''}</div><div class="header-actions"><button class="btn" id="switchBoard">← <span>보드 목록</span></button></div></div>
      <div class="stats-grid"><section class="panel"><div class="panel-title"><div><h2>전체 프로젝트 진척도</h2><p>완료된 담당 파트 기준으로 계산해요</p></div><strong class="completion-number">${overall}%</strong></div><div class="progress-track"><div class="progress-fill" style="width:${overall}%"></div></div><div class="overall-caption"><span>완료 ${done}건</span><span>전체 ${b.tasks.length}건</span></div><div class="member-progress">${stats.map(s=>`<div class="member-row"><div class="member-label"><span class="mini-avatar" style="background:${colors[s.i%colors.length]}">${esc(s.name[0])}</span><span>${esc(s.name)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${s.pct}%"></div></div><div class="member-count">${s.pct.toFixed(0)}%</div></div>`).join('')}</div></section>
      <section class="panel"><div class="panel-title"><div><h2>기여도 현황</h2><p>완료 태스크 비율 · 전체 완료 ${done}건</p></div><span class="legend">완료 / 담당</span></div><div class="member-progress">${stats.map(s=>`<div class="member-row"><div class="member-label"><span class="mini-avatar" style="background:${colors[s.i%colors.length]}">${esc(s.name[0])}</span><span>${esc(s.name)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${s.pct}%"></div></div><div class="member-count">${s.done}/${s.tasks}</div></div>`).join('')}</div><p style="font-size:11px;color:#94a3b8;margin-top:16px">* 기여도는 완료된 태스크 중 개인 완료 건수 비율입니다.</p></section></div>
      <div class="tabbar"><button class="tab ${activeTab==='tasks'?'active':''}" data-tab="tasks">담당 파트 <span class="mono">${b.tasks.length}</span></button><button class="tab ${activeTab==='meetings'?'active':''}" data-tab="meetings">회의록 <span class="mono">${b.meetings.length}</span></button></div>
      <section class="tab-content ${activeTab==='tasks'?'active':''}" id="tasksView"><div class="section-head"><div><h2>역할과 산출물</h2><p>담당 파트의 진행 상황을 함께 관리해요.</p></div><button class="btn btn-primary" id="addTask">＋ 담당 파트 추가</button></div><div class="filters"><button class="filter ${currentFilter==='all'?'active':''}" data-filter="all">전체</button>${b.members.map(n=>`<button class="filter ${currentFilter===n?'active':''}" data-filter="${esc(n)}">${esc(n)}</button>`).join('')}</div><div class="task-grid">${list.length?list.map(t=>taskCard(t,b)).join(''):`<div class="empty"><div class="empty-icon">▤</div><strong>${b.tasks.length?'해당 조원의 담당 파트가 없어요':'아직 등록된 담당 파트가 없습니다.'}</strong><span>${b.tasks.length?'다른 조원을 선택하거나 담당 파트를 추가해 보세요':"'+ 담당 파트 추가' 버튼을 눌러 역할을 배분해 보세요."}</span></div>`}</div></section>
      <section class="tab-content ${activeTab==='meetings'?'active':''}" id="meetingsView"><div class="section-head"><div><h2>회의록 아카이브</h2><p>결정 사항과 다음 할 일을 날짜별로 기록해요.</p></div><button class="btn btn-primary" id="addMeeting">＋ 회의록 작성하기</button></div><div class="meeting-list">${b.meetings.length?[...b.meetings].sort((a,c)=>c.date.localeCompare(a.date)).map(meetingCard).join(''):`<div class="empty"><div class="empty-icon">✎</div><strong>아직 저장된 회의록이 없어요.</strong><span>회의에서 정한 내용과 다음 할 일을 기록해 보세요.</span></div>`}</div></section><div class="footer">팀플의 모든 약속과 진행 상황, 한곳에서 함께.</div></div>`;
      document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{activeTab=el.dataset.tab;dashboard(b)});document.querySelectorAll('[data-filter]').forEach(el=>el.onclick=()=>{currentFilter=el.dataset.filter;dashboard(b)});document.querySelector('#addTask').onclick=()=>taskModal();document.querySelector('#addMeeting').onclick=()=>meetingModal();document.querySelector('#switchBoard').onclick=()=>{setUrl(null);render()};app.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>taskModal(b.tasks.find(t=>t.id===el.dataset.edit)));app.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>{if(confirm('이 담당 파트를 삭제할까요?')){b.tasks=b.tasks.filter(t=>t.id!==el.dataset.delete);persist();dashboard(b)}});app.querySelectorAll('[data-toggle-original]').forEach(el=>el.onclick=()=>{let node=document.querySelector('#original-'+el.dataset.toggleOriginal);node.classList.toggle('hidden');el.textContent=node.classList.contains('hidden')?'원문 펼치기 ↓':'원문 접기 ↑'});
    }
    function taskCard(t,b){const s=statusOf(t),late=s==='late';return `<article class="task-card ${late?'overdue':''}"><div class="task-top"><div class="avatar" style="background:${colors[Math.max(0,b.members.indexOf(t.owner))%colors.length]}">${esc(t.owner[0])}</div><div class="task-main"><h3>${esc(t.title)}</h3><div class="task-owner">담당 <b style="color:#334155">${esc(t.owner)}</b></div></div><div class="task-tools"><button class="btn btn-sm icon-btn" data-edit="${t.id}" aria-label="수정">✎</button><button class="btn btn-sm icon-btn btn-quiet" data-delete="${t.id}" aria-label="삭제">×</button></div></div><div class="task-bottom"><div class="task-due"><span>◷</span><span class="mono">${esc(t.due)}</span><span class="status ${s==='late'?'late':s==='done'?'done':s==='progress'?'progress':'warning'}">${late?'마감지연':s==='done'?'제출완료':`${Math.ceil((new Date(t.due+'T23:59:59')-new Date())/86400000)<=0?'D-Day':'D-'+Math.ceil((new Date(t.due+'T23:59:59')-new Date())/86400000)}`}</span></div><div class="task-links">${t.url?`<a class="btn btn-sm" href="${esc(t.url)}" target="_blank" rel="noopener">↗ 링크 열기</a>`:''}<select class="select" data-status="${t.id}" style="width:auto;padding:6px 8px;font-size:11px"><option value="todo" ${t.status==='todo'?'selected':''}>진행전</option><option value="progress" ${t.status==='progress'?'selected':''}>진행중</option><option value="done" ${t.status==='done'?'selected':''}>제출완료</option></select></div></div></article>`}
    function meetingCard(m){return `<article class="meeting-card"><div class="meeting-meta"><time>${esc(m.date)}</time><div class="attendees">${m.attendees.map(n=>`<span class="attendee">${esc(n)}</span>`).join('')}</div></div><div class="decision">${esc(m.decisions)}</div>${m.actions?`<div class="meeting-subtitle">다음 할 일</div>${m.actions.split('\n').filter(Boolean).map(a=>`<div class="action-line">☐ ${esc(a.replace(/^[-•\s]+/,''))}</div>`).join('')}`:''}${m.original?`<button class="meeting-original" data-toggle-original="${m.id}">원문 펼치기 ↓</button><div id="original-${m.id}" class="original-text hidden">${esc(m.original)}</div>`:''}</article>`}
    function taskModal(task){const b=board(),edit=!!task;modalRoot.innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">${edit?'담당 파트 수정':'담당 파트 추가'}</h2><p>역할과 마감일, 산출물 상태를 기록해요.</p></div><button class="btn icon-btn" id="closeModal" aria-label="닫기">×</button></div><form id="taskForm"><div class="field"><label>담당자 *</label><select class="select" name="owner" required><option value="">조원 선택</option>${b.members.map(n=>`<option ${task?.owner===n?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div class="field"><label>담당 파트명 *</label><input class="input" name="title" minlength="2" maxlength="40" required value="${esc(task?.title||'')}" placeholder="예: 경쟁사 사례 조사 및 표 정리" /></div><div class="field"><label>세부 마감일 *</label><input class="input" type="date" name="due" required value="${esc(task?.due||today())}" /></div><div class="field"><label>산출물 URL</label><input class="input" name="url" maxlength="300" value="${esc(task?.url||'')}" placeholder="https://docs.google.com/..." /><p class="hint">http:// 또는 https://로 시작하는 링크를 입력해 주세요.</p></div><label class="checkline"><input type="checkbox" name="complete" ${task?.status==='done'?'checked':''}/> 산출물을 제출 완료했어요</label><div class="form-error" id="taskError"></div><div class="modal-actions"><button type="button" class="btn" id="cancelModal">취소</button><button class="btn btn-primary">저장하기</button></div></form></div></div>`;
      const close=()=>modalRoot.innerHTML='';document.querySelector('#closeModal').onclick=close;document.querySelector('#cancelModal').onclick=close;document.querySelector('#backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};document.querySelector('#taskForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),url=f.get('url').trim(),err=document.querySelector('#taskError');if(url&&!/^https?:\/\//i.test(url)){err.textContent='올바른 웹 링크(http:// 또는 https://) 형식으로 입력해 주세요.';return}const v={id:task?.id||newId(),owner:f.get('owner'),title:f.get('title').trim(),due:f.get('due'),url,status:f.get('complete')?'done':task?.status==='done'?'progress':task?.status||'todo'};if(task)Object.assign(task,v);else b.tasks.push(v);persist();close();dashboard(b)};document.querySelector('[data-status]')?.focus();}
    function meetingModal(){const b=board();modalRoot.innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><div><h2 id="modalTitle">회의록 작성하기</h2><p>회의 결과를 팀이 함께 볼 수 있도록 정리해요.</p></div><button class="btn icon-btn" id="closeModal" aria-label="닫기">×</button></div><form id="meetingForm"><div class="field"><label>회의 일자 *</label><input class="input" type="date" name="date" value="${today()}" required /></div><div class="field"><label>참석자</label><div>${b.members.map((n,i)=>`<label class="checkline"><input type="checkbox" name="attendees" value="${esc(n)}" ${i===0?'checked':''}/>${esc(n)}</label>`).join('')}</div></div><div class="field"><label>회의 원문 메모 <span style="color:#94a3b8;font-weight:400">선택</span></label><textarea class="textarea" name="original" maxlength="1000" placeholder="회의에서 나온 이야기들을 자유롭게 적어 주세요."></textarea></div><div class="field"><label>핵심 결정 사항 *</label><textarea class="textarea" name="decisions" minlength="5" maxlength="300" required placeholder="예:&#10;• 설문 대상은 20대 대학생으로 정한다&#10;• 발표 자료는 다음 주까지 초안을 완성한다"></textarea></div><div class="field"><label>다음 할 일 <span style="color:#94a3b8;font-weight:400">선택 · 줄마다 한 항목</span></label><textarea class="textarea" name="actions" maxlength="300" placeholder="김민지 - 설문 문항 초안&#10;이준호 - 경쟁사 자료 조사"></textarea></div><div class="form-error" id="meetingError"></div><div class="modal-actions"><button type="button" class="btn" id="cancelModal">취소</button><button class="btn btn-primary">회의록 저장</button></div></form></div></div>`;const close=()=>modalRoot.innerHTML='';document.querySelector('#closeModal').onclick=close;document.querySelector('#cancelModal').onclick=close;document.querySelector('#backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};document.querySelector('#meetingForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),decisions=f.get('decisions').trim();if(decisions.length<5){document.querySelector('#meetingError').textContent='팀원들이 한눈에 볼 수 있도록 핵심 결정 사항을 5자 이상 입력해 주세요.';return}b.meetings.push({id:newId(),date:f.get('date'),attendees:f.getAll('attendees'),original:f.get('original').trim(),decisions,actions:f.get('actions').trim()});persist();close();activeTab='meetings';dashboard(b)}}
    app.addEventListener('change',e=>{if(e.target.matches('[data-status]')){const t=board().tasks.find(t=>t.id===e.target.dataset.status);if(t){t.status=e.target.value;persist();dashboard(board())}}});
    document.querySelector('#homeLink').onclick=e=>{e.preventDefault();setUrl(null);render()};window.addEventListener('popstate',()=>{currentId=new URLSearchParams(location.search).get('board');render()});document.addEventListener('keydown',e=>{if(e.key==='Escape')modalRoot.innerHTML=''});render();
  })();
  </script>
</body>
</html>
